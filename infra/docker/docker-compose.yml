# Full local stack — run from repo root: make dev
# Services: postgres, redis, agent (FastAPI), web (Next.js), n8n

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: biagent
      POSTGRES_PASSWORD: biagent
      POSTGRES_DB: biagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent:
    build:
      context: ../..
      dockerfile: infra/docker/agent.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../../apps/agent/.env
    environment:
      # Override DB/Redis to use container hostnames, not localhost. No n8n URL:
      # the agent does not call n8n — n8n calls the agent.
      DATABASE_URL: postgresql+asyncpg://biagent:biagent@postgres/biagent
      REDIS_URL: redis://redis:6379
      MCP_SERVER_URL: http://mcp-server:8001/mcp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_started
    restart: unless-stopped

  mcp-server:
    build:
      context: ../..
      dockerfile: infra/docker/agent.Dockerfile
    command: ["/app/.venv/bin/python", "-m", "app.mcp_server.server"]
    expose:
      - "8001"
    env_file:
      - ../../apps/agent/.env
    environment:
      # Connectors resolve per-user OAuth tokens from the same DB as the agent
      DATABASE_URL: postgresql+asyncpg://biagent:biagent@postgres/biagent
      REDIS_URL: redis://redis:6379
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: "8001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ../../apps/web/.env.local
    environment:
      # Override to use container hostname instead of localhost
      AGENT_URL: http://agent:8000
    depends_on:
      - agent
    restart: unless-stopped

  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: admin
      N8N_HOST: localhost
      N8N_PORT: 5678
      WEBHOOK_URL: http://localhost:5678
      AGENT_URL: http://agent:8000
      # The ticker signs its request body with this; the agent rejects the call
      # with 401 unless the two match. Interpolated from the shell rather than
      # loaded via env_file: N8N_BLOCK_ENV_ACCESS_IN_NODE is false, so anything
      # in this container's environment is readable from any workflow's code
      # node — the agent's .env has no business in here.
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me-webhook-secret}
      REPORT_FROM_EMAIL: ${REPORT_FROM_EMAIL:-bi-agent@localhost}
      REPORT_TO_EMAIL: ${REPORT_TO_EMAIL:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  pgdata:
  n8n_data:
